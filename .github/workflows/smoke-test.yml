name: Smoke test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # The server needs Java 21 or later, which is newer than the default Java of some runners.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: sublimelsp/lsp_smoke_test@v1
